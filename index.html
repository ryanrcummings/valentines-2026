<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Love: 1 or 1?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content-box">
        <img src="monster.png" alt="Cute Valentine Monster" class="monster">
        <h1>Will you be my Valentine?</h1>
        <div class="button-container">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </div>

    <div id="spotify-player" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; z-index:1000;">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/3lFvgGhin8RuplMTfKlhSF?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const noButton = document.getElementById('no');
            const yesButton = document.getElementById('yes');
            
            noButton.addEventListener('mouseenter', function () {
                moveButton();
                generateEvilFaces();
            });

            // Touch support for mobile
            noButton.addEventListener('touchstart', function (e) {
                e.preventDefault();
                moveButton();
                generateEvilFaces();
            });

            function moveButton() {
                const maxX = window.innerWidth - noButton.offsetWidth - 20;
                const maxY = window.innerHeight - noButton.offsetHeight - 20;
                const newX = Math.random() * maxX;
                const newY = Math.random() * maxY;
                noButton.style.position = 'fixed';
                noButton.style.left = newX + 'px';
                noButton.style.top = newY + 'px';
            }
            
            yesButton.addEventListener('click', function () {
                alert("Yay! Can't wait for our date! ❤️");
                confetti();
                document.getElementById("spotify-player").style.display = 'block';
            });

            function generateEvilFaces() {
                for (let i = 0; i < 5; i++) {
                    let evilFace = document.createElement('div');
                    evilFace.innerHTML = '😈';
                    evilFace.classList.add('evil-face');
                    document.body.appendChild(evilFace);
                    
                    let x = Math.random() * window.innerWidth;
                    let y = Math.random() * window.innerHeight;
                    
                    evilFace.style.left = `${x}px`;
                    evilFace.style.top = `${y}px`;
                    
                    setTimeout(() => {
                        evilFace.remove();
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
