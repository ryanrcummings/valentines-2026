<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question...</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mini Game -->
    <div class="game-container" id="game-container">
        <div class="game-header">
            <h2>Catch 10 Hearts! 💕</h2>
            <p class="game-score">Hearts caught: <span id="heart-count">0</span> / 10</p>
        </div>
    </div>

    <div class="content-box" id="content-box" style="display:none;">
        <img src="monster.png" alt="Cute Valentine Monster" class="monster">
        <h1>Will you be my Valentine?</h1>
        <div class="button-container">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
    </div>

    <div id="no-counter" style="display:none; margin-top:15px; font-size:0.9em; color:#666;"></div>

    <div id="spotify-player" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; z-index:1000;">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/3lFvgGhin8RuplMTfKlhSF?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Mini Game Logic
            const gameContainer = document.getElementById('game-container');
            const contentBox = document.getElementById('content-box');
            const heartCountDisplay = document.getElementById('heart-count');
            let heartsCaught = 0;
            const heartsNeeded = 10;
            let gameActive = true;
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💝', '🩷'];

            function createFallingHeart() {
                if (!gameActive) return;

                const heart = document.createElement('div');
                heart.className = 'falling-heart';
                heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * (window.innerWidth - 50) + 'px';
                heart.style.top = '-50px';
                gameContainer.appendChild(heart);

                const duration = 3000 + Math.random() * 2000;
                heart.style.animation = `fall ${duration}ms linear forwards`;

                heart.addEventListener('click', function() {
                    if (!gameActive) return;
                    heartsCaught++;
                    heartCountDisplay.textContent = heartsCaught;
                    heart.remove();
                    confetti({ particleCount: 30, spread: 50, origin: { x: parseFloat(heart.style.left) / window.innerWidth, y: 0.5 } });

                    if (heartsCaught >= heartsNeeded) {
                        gameActive = false;
                        setTimeout(endGame, 500);
                    }
                });

                heart.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    heart.click();
                });

                setTimeout(() => heart.remove(), duration);
            }

            function endGame() {
                gameContainer.style.transition = 'opacity 1s';
                gameContainer.style.opacity = '0';
                setTimeout(() => {
                    gameContainer.style.display = 'none';
                    contentBox.style.display = 'block';
                    confetti({ particleCount: 100, spread: 70 });
                }, 1000);
            }

            // Spawn hearts regularly
            setInterval(createFallingHeart, 400);
            createFallingHeart();

            // Original Valentine Logic
            const noButton = document.getElementById('no');
            const yesButton = document.getElementById('yes');
            let noAttempts = 0;

            noButton.addEventListener('mouseenter', function () {
                noAttempts++;
                moveButton();
                generateEvilFaces();
            });

            // Touch support for mobile
            noButton.addEventListener('touchstart', function (e) {
                e.preventDefault();
                noAttempts++;
                moveButton();
                generateEvilFaces();
            });

            function moveButton() {
                const maxX = window.innerWidth - noButton.offsetWidth - 20;
                const maxY = window.innerHeight - noButton.offsetHeight - 20;
                const newX = Math.random() * maxX;
                const newY = Math.random() * maxY;
                noButton.style.position = 'fixed';
                noButton.style.left = newX + 'px';
                noButton.style.top = newY + 'px';
            }
            
            yesButton.addEventListener('click', function () {
                showCustomModal("Your Secret Admirer", "Yay! Can't wait for our date! ❤️");
                confetti();
                document.getElementById("spotify-player").style.display = 'block';

                const counterDiv = document.getElementById('no-counter');
                if (noAttempts > 0) {
                    counterDiv.innerHTML = "You tried to say no " + noAttempts + " time" + (noAttempts === 1 ? "" : "s") + "... but love always wins. 💕";
                } else {
                    counterDiv.innerHTML = "You didn't even try to say no! 😍";
                }
                counterDiv.style.display = 'block';
                document.querySelector('.content-box').appendChild(counterDiv);
            });

            function showCustomModal(title, message) {
                const modal = document.createElement('div');
                modal.className = 'custom-modal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <h3>${title}</h3>
                        <p>${message}</p>
                        <button id="modal-ok-btn">OK</button>
                    </div>
                `;
                document.body.appendChild(modal);

                const okBtn = document.getElementById('modal-ok-btn');
                okBtn.addEventListener('click', function() {
                    modal.remove();
                });
                okBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    modal.remove();
                });
            }

            function generateEvilFaces() {
                for (let i = 0; i < 5; i++) {
                    let evilFace = document.createElement('div');
                    evilFace.innerHTML = '😈';
                    evilFace.classList.add('evil-face');
                    document.body.appendChild(evilFace);
                    
                    let x = Math.random() * window.innerWidth;
                    let y = Math.random() * window.innerHeight;
                    
                    evilFace.style.left = `${x}px`;
                    evilFace.style.top = `${y}px`;
                    
                    setTimeout(() => {
                        evilFace.remove();
                    }, 1000);
                }
            }
        });
    </script>
</body>
</html>
